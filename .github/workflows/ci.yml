name: CI

on:
  push:
    branches: [ main, '**' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.9, 3.10, 3.11]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          if (Test-Path requirements.txt) { pip install -r requirements.txt } else { pip install pytest }
      - name: Run tests
        run: |
          if (Test-Path tests) { pytest -q } else { echo "No tests/ directory found; consider adding pytest tests." }
